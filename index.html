<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 홈페이지</title>
  <style>
    /* 햇살 드는 서재 */
    body {
      margin: 0;
      padding: 60px 16px;
      box-sizing: border-box;
      min-height: 100vh;
      overflow-x: hidden;
      color: #4a3426;             /* 글자: 짙은 갈색 (나무 책장) */
      background-color: #e9dcc4;  /* 사진을 불러오기 전에 보이는 색 */
      background-image: url("images/study-room.webp");
      background-size: cover;     /* 화면을 꽉 채우기 */
      background-position: center;
      background-attachment: fixed; /* 스크롤해도 배경은 그대로 */
    }

    /* 글 상자: 사진 위에서도 잘 읽히도록 반투명 상자 */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 28px;
      background: none;            /* 큰 상자 없이 배경 사진이 그대로 보이게 */
    }
    /* 글자 바로 뒤에만 깔리는 크림색 띠: 글자 부분만 가리고 나머지는 사진이 보임 */
    .text-bg {
      background-color: rgba(255, 250, 244, 0.9);
      padding: 3px 10px;
      border-radius: 8px;
      box-decoration-break: clone;          /* 줄이 바뀌어도 줄마다 띠가 예쁘게 */
      -webkit-box-decoration-break: clone;
    }
    h1 {
      margin-top: 0;
      color: #c2552b;             /* 제목: 감 주황색 */
    }
    p {
      color: #7a5230;             /* 문단: 따뜻한 갈색 */
      line-height: 2;             /* 줄마다 띠가 겹치지 않게 넉넉히 */
    }
    a {
      color: #c2552b;             /* 링크: 감 주황색 */
    }

    /* ---------- 손글씨 폰트 (눈누: 그리운 묘은흘림체) ---------- */
    @font-face {
      font-family: 'NostalgicMyoeunHeullim';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_MyoeunHeullim-Rg.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    /* 이메일: 손글씨 + 형광펜 밑줄 느낌 */
    .email {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-family: 'NostalgicMyoeunHeullim', cursive;
      font-size: 26px;
      color: #8a3b1c;
      text-decoration: none;
      /* 아래쪽 절반만 칠해서 형광펜으로 그은 느낌 */
      /* 크림색 띠 위에 형광펜 밑줄 (배경 두 겹) */
      background:
        linear-gradient(transparent 60%, rgba(240, 168, 80, 0.45) 60%),
        rgba(255, 250, 244, 0.9);
      padding: 0 10px;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .email:hover {
      transform: rotate(-2deg) scale(1.05);   /* 마우스를 올리면 살짝 기울어짐 */
    }

    /* ---------- 배치 ---------- */
    /* 제목 + 이메일을 세로로 묶기 */
    .profile-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }
    .intro {
      margin: 18px 0 22px;
      word-break: keep-all;        /* 한글 단어 중간에서 줄바꿈하지 않기 */
    }
    /* 버튼 두 개: 같은 너비의 두 칸 */
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));  /* 두 칸 너비를 정확히 같게 */
      gap: 16px;
    }
    .buttons .glow-inner {
      width: 100%;
      justify-content: center;     /* 글자를 버튼 가운데로 */
      white-space: nowrap;
    }    /* ---------- 마그네틱 글로우 버튼 ----------
       빛이 테두리를 따라 돌고, 마우스 쪽으로 살짝 끌려오는 버튼 */

    /* 회전 각도를 애니메이션할 수 있도록 '각도' 변수로 등록 */
    @property --glow-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes glow-spin   { to { --glow-angle: 360deg; } }
    @keyframes glow-ripple {
      from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      to   { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    .glow-btn {
      /* 버튼마다 바꿔 쓰는 색 변수 */
      --c1: #ffd27a;
      --c2: #e8743b;
      --c3: #c2552b;
      --inner: #4a2e1c;

      position: relative;
      isolation: isolate;          /* 빛 번짐이 버튼 뒤에만 깔리도록 */
      display: inline-flex;
      padding: 2px;                /* 이 2px이 빛나는 테두리 두께 */
      border-radius: 999px;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.3s ease-out;
    }
    /* 키보드(Tab)로 선택했을 때 테두리 표시 */
    .glow-btn:focus-visible {
      outline: 2px solid var(--c2);
      outline-offset: 5px;
    }

    /* 돌아가는 무지개 테두리 */
    .glow-ring,
    .glow-halo {
      position: absolute;
      border-radius: inherit;
      background: conic-gradient(from var(--glow-angle), var(--c1), var(--c2), var(--c3), var(--c1));
      animation: glow-spin 3s linear infinite;
      pointer-events: none;
    }
    .glow-ring { inset: 0; z-index: -1; }
    /* 같은 색을 흐리게 깔아 빛 번짐 만들기 */
    .glow-halo {
      inset: -6px;
      z-index: -2;
      filter: blur(12px);
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .glow-btn:hover .glow-halo,
    .glow-btn:focus-visible .glow-halo { opacity: 0.9; }

    /* 버튼 안쪽 (진한 바탕) */
    .glow-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      border-radius: inherit;
      background-color: var(--inner);
      padding: 11px 22px;
      font-size: 15px;
    }
    /* 마우스 위치를 따라다니는 하이라이트 */
    .glow-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(90px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.25), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .glow-btn:hover .glow-inner::before { opacity: 1; }
    .glow-label { position: relative; }

    /* 클릭하면 퍼지는 물결 */
    .glow-ripple {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      animation: glow-ripple 0.7s ease-out forwards;
    }

    /* 인스타그램 버튼: 색만 바꾸기 */
    .glow-insta {
      --c1: #f9a03f;
      --c2: #e1306c;
      --c3: #833ab4;
      --inner: #2a1238;
    }

    /* 움직임 줄이기 설정을 켠 사용자는 회전·물결 끄기 */
    @media (prefers-reduced-motion: reduce) {
      .glow-ring, .glow-halo, .glow-ripple { animation: none; }
      .glow-btn { transition: none; }
    }

    /* ---------- 프로필 사진 (하마) ---------- */
    .profile {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
    }
    /* ---------- 홀로그램 틸트 프로필 ----------
       JavaScript가 --tx, --ty(기울기 -1~1), --hyp(기운 정도), --flip(뒤집힘 각도),
       --lift(뒤집힐 때 떠오름)를 매 순간 바꿔 주고, CSS는 그 값으로 모양을 그림 */
    .holo {
      --tx: 0;
      --ty: 0;
      --hyp: 0;
      --flip: 0deg;
      --lift: 0;
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      perspective: 420px;          /* 3D 원근감 */
      -webkit-tap-highlight-color: transparent;
    }
    .holo-card {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform:
        translateZ(calc(var(--lift) * 30px))
        rotateX(calc(var(--ty) * -18deg))
        rotateY(calc(var(--tx) * 22deg + var(--flip)));
      transition: scale 0.3s cubic-bezier(.2, .9, .3, 1.4);
    }
    .holo:active .holo-card { scale: 0.95; }   /* 누르면 살짝 눌림 */

    .holo-face {
      position: absolute;
      inset: 0;
      display: block;
      border-radius: 50%;          /* 동그랗게 */
      overflow: hidden;
      backface-visibility: hidden; /* 뒤집혔을 때 뒷모습 숨기기 */
      -webkit-backface-visibility: hidden;
      background-color: #fde3c4;
      border: 4px solid #fff;
      /* 기울수록 주황빛 후광이 커짐 */
      box-shadow:
        0 4px 14px rgba(110, 61, 29, 0.25),
        0 0 calc(var(--hyp) * 26px) rgba(232, 116, 59, 0.55);
    }
    .avatar-art {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 뒷면: 단풍색 원형 무늬 */
    .holo-back {
      transform: rotateY(180deg);
      display: grid;
      place-items: center;
      background: conic-gradient(from calc(var(--tx) * 90deg), #ffd27a, #e8743b, #c2552b, #8a3b1c, #ffd27a);
    }
    .holo-back-text {
      position: relative;
      display: grid;
      justify-items: center;
      line-height: 1.1;
      color: #fff;
      font-size: 22px;
      text-shadow: 0 1px 3px rgba(74, 46, 28, 0.6);
    }
    .holo-back-text b     { font-size: 15px; letter-spacing: 0.12em; margin-top: 2px; }
    .holo-back-text small { font-size: 8px;  letter-spacing: 0.2em; opacity: 0.9; }

    /* 무지개 포일: 기울기에 따라 무지개 띠가 미끄러짐 */
    .holo-foil {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: repeating-linear-gradient(115deg,
        hsl(10 100% 62%) 0%, hsl(45 100% 62%) 4%,
        hsl(170 100% 62%) 8%, hsl(285 100% 66%) 12%, hsl(10 100% 62%) 16%);
      background-size: 300% 300%;
      background-position: calc(50% + var(--tx) * 40%) calc(50% + var(--ty) * 40%);
      mix-blend-mode: overlay;
      opacity: calc(0.2 + var(--hyp) * 0.55);
    }
    /* 반사광: 마우스 쪽에 하얀 빛 */
    .holo-glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(farthest-corner circle at calc(50% + var(--tx) * 48%) calc(50% + var(--ty) * 48%),
        rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.28) 18%, transparent 55%);
      mix-blend-mode: overlay;
      opacity: calc(0.3 + var(--hyp) * 0.7);
    }
    /* 앞면으로 돌아올 때 한 번 지나가는 반짝임 */
    .holo-shine {
      position: absolute;
      inset: -60%;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.6) 50%, transparent 58%);
      translate: -70% 0;
      opacity: 0;
    }
    .holo-shine.is-on { animation: holo-sweep 0.9s cubic-bezier(.3, .6, .2, 1); }
    @keyframes holo-sweep {
      from { translate: -70% 0; opacity: 1; }
      to   { translate: 70% 0;  opacity: 1; }
    }
    /* 키보드로 선택했을 때 표시 */
    .holo:focus-visible { outline: none; }
    .holo:focus-visible .holo-face {
      box-shadow: 0 0 0 3px #c2552b, 0 0 0 7px rgba(232, 116, 59, 0.35);
    }
    .profile h1 {
      margin: 0;
      word-break: keep-all;        /* 한글 단어 중간에서 줄바꿈하지 않기 */
    }

    /* ---------- 미니 MP3 플레이어 ---------- */
    .player {
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
      padding: 8px 10px 8px 12px;
      border-radius: 14px;
      background-color: rgba(255, 250, 244, 0.9);
      box-shadow: 0 4px 14px rgba(74, 52, 38, 0.2);
    }
    .player-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;     /* 제목이 길면 ... 으로 */
      font-size: 14px;
      font-weight: bold;
      color: #4a3426;
      text-align: left;
    }
    .player-buttons {
      display: flex;
      gap: 6px;
    }
    .player-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background-color: #4a2e1c;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
    }
    .player-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .player-btn:hover { transform: scale(1.08); }
    .player-btn:active { transform: scale(0.94); }
    /* 지금 상태인 버튼은 감 주황색으로 빛나기 */
    .player-btn[aria-pressed="true"] {
      background-color: #c2552b;
      box-shadow: 0 0 0 3px rgba(232, 116, 59, 0.3);
    }
    .player-btn:focus-visible {
      outline: 2px solid #c2552b;
      outline-offset: 2px;
    }
    .player-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .player-bar {
      position: relative;
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background-color: rgba(74, 46, 28, 0.15);
      overflow: hidden;
    }
    .player-progress {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd27a, #e8743b, #c2552b);
    }
    .player-time {
      font-size: 11px;
      color: #7a5230;
      font-variant-numeric: tabular-nums;   /* 숫자 폭을 같게 해서 흔들리지 않게 */
    }
    /* 재생 중이면 막대 3개가 춤추는 이퀄라이저 */
    .player-eq {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 14px;
      height: 14px;
    }
    .player-eq i {
      flex: 1;
      height: 30%;
      border-radius: 1px;
      background-color: #c2552b;
    }
    .player.is-playing .player-eq i { animation: eq 0.9s ease-in-out infinite alternate; }
    .player.is-playing .player-eq i:nth-child(2) { animation-delay: 0.3s; }
    .player.is-playing .player-eq i:nth-child(3) { animation-delay: 0.6s; }
    @keyframes eq {
      from { height: 25%; }
      to   { height: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .player.is-playing .player-eq i { animation: none; height: 70%; }
    }

    /* 휴대폰처럼 좁은 화면: 프로필을 가운데 세로 정렬, 버튼 글자 조금 작게
       (위의 기본 설정을 덮어써야 하므로 맨 마지막에 둠) */
    @media (max-width: 480px) {
      main { padding: 22px 18px; }
      .profile { flex-direction: column; text-align: center; gap: 12px; }
      .profile-text { align-items: center; }
      .holo { width: 96px; height: 96px; }
      .email { font-size: 22px; }
      .intro { text-align: center; }
      .buttons { gap: 10px; }
      .buttons .glow-inner { padding: 11px 4px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- 배경: 햇살 드는 서재 사진 (CSS의 body 배경으로 깔림) -->

  <main>
    <div class="profile">
      <!-- 프로필 사진: 귀여운 하마 (SVG로 직접 그림) -->
      <!-- 홀로그램 틸트: 마우스를 따라 기울고 무지개빛으로 반짝이며, 누르면 뒤집힘 -->
      <button class="holo" type="button" aria-pressed="false" aria-label="귀여운 하마 프로필 카드 뒤집기">
        <span class="holo-card">
          <span class="holo-face holo-front">
      <svg class="avatar-art" viewBox="0 0 120 120" aria-hidden="true">
        <!-- 귀 -->
        <ellipse cx="34" cy="30" rx="10" ry="12" fill="#9b8fc9"/>
        <ellipse cx="86" cy="30" rx="10" ry="12" fill="#9b8fc9"/>
        <ellipse cx="34" cy="31" rx="5"  ry="7"  fill="#f2a7b8"/>
        <ellipse cx="86" cy="31" rx="5"  ry="7"  fill="#f2a7b8"/>
        <!-- 머리 -->
        <ellipse cx="60" cy="55" rx="36" ry="32" fill="#b3a8e0"/>
        <!-- 눈 -->
        <circle cx="45" cy="48" r="6" fill="#3b2a4d"/>
        <circle cx="75" cy="48" r="6" fill="#3b2a4d"/>
        <circle cx="47" cy="46" r="2" fill="#fff"/>
        <circle cx="77" cy="46" r="2" fill="#fff"/>
        <!-- 큰 주둥이 -->
        <ellipse cx="60" cy="82" rx="40" ry="26" fill="#c9bff0"/>
        <!-- 콧구멍 -->
        <ellipse cx="48" cy="74" rx="4" ry="5" fill="#7d6fb0"/>
        <ellipse cx="72" cy="74" rx="4" ry="5" fill="#7d6fb0"/>
        <!-- 볼터치 -->
        <ellipse cx="28" cy="80" rx="7" ry="4" fill="#f4a6b4" opacity="0.8"/>
        <ellipse cx="92" cy="80" rx="7" ry="4" fill="#f4a6b4" opacity="0.8"/>
        <!-- 웃는 입 -->
        <path d="M50 90 Q60 98 70 90" stroke="#7d6fb0" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- 머리 위 단풍잎 -->
        <path d="M60 14 L64 22 L72 20 L67 27 L74 32 L65 32 L60 40 L55 32 L46 32 L53 27 L48 20 L56 22 Z" fill="#d9542b"/>
      </svg>
            <span class="holo-foil" aria-hidden="true"></span>
            <span class="holo-glare" aria-hidden="true"></span>
            <span class="holo-shine" aria-hidden="true"></span>
          </span>
          <!-- 카드 뒷면 -->
          <span class="holo-face holo-back" aria-hidden="true">
            <span class="holo-back-text">🍁<b>HIPPO</b><small>2026 AUTUMN</small></span>
            <span class="holo-foil"></span>
            <span class="holo-glare"></span>
          </span>
        </span>
      </button>
      <!-- 이름 바로 아래에 연락처: 명함처럼 '누구인지 + 연락처'를 한 덩어리로 -->
      <div class="profile-text">
        <h1><span class="text-bg">안녕하세요!</span></h1>
        <!-- 미니 MP3 플레이어 -->
        <div class="player" role="group" aria-label="배경 음악 플레이어">
          <div class="player-top">
            <span class="player-eq" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="player-title">Contented Game Loop</span>
            <span class="player-buttons">
              <button class="player-btn" type="button" data-act="play" aria-label="재생" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="player-btn" type="button" data-act="pause" aria-label="일시정지" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
              </button>
              <button class="player-btn" type="button" data-act="stop" aria-label="정지 (음악 끄기)" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
              </button>
            </span>
          </div>
          <div class="player-bottom">
            <span class="player-bar"><span class="player-progress"></span></span>
            <span class="player-time" aria-live="off">0:00 / 0:00</span>
          </div>
        </div>
        <a class="email" href="mailto:h9215745@naver.com">✉ h9215745@naver.com</a>
      </div>
    </div>
    <p class="intro"><span class="text-bg">눈 내리는 밤, 작은 하마가 첫 문을 열었습니다.<br>천천히 둘러보고, 따뜻한 마음 한 조각 두고 가세요. ✨</span></p>
    <!-- 버튼 두 개를 같은 너비로 나란히 -->
    <div class="buttons">
      <!-- 블로그 버튼: 누르면 새 탭에서 내 네이버 블로그가 열림 -->
      <a class="glow-btn" href="https://blog.naver.com/h9215745" target="_blank" rel="noopener">
        <span class="glow-halo" aria-hidden="true"></span>
        <span class="glow-ring" aria-hidden="true"></span>
        <span class="glow-inner"><span class="glow-label">📝 내 블로그 가기</span></span>
      </a>
      <!-- 인스타그램 버튼 -->
      <a class="glow-btn glow-insta" href="https://www.instagram.com/smartmanchae/" target="_blank" rel="noopener">
        <span class="glow-halo" aria-hidden="true"></span>
        <span class="glow-ring" aria-hidden="true"></span>
        <span class="glow-inner"><span class="glow-label">📷 @smartmanchae</span></span>
      </a>
    </div>
  </main>

  <!-- 배경 음악: loop = 끝나면 처음부터 다시 -->
  <audio id="bgm" src="audio/contented-game-loop.mp3" loop preload="auto"></audio>

  <script>
    // 마그네틱 글로우 버튼: 마우스를 따라 끌려오기 + 하이라이트 + 클릭 물결
    const STRENGTH = 12; // 끌려가는 최대 거리(px)
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    document.querySelectorAll(".glow-btn").forEach((btn) => {
      const inner = btn.querySelector(".glow-inner");

      btn.addEventListener("pointermove", (event) => {
        const box = btn.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width;   // 0 ~ 1
        const y = (event.clientY - box.top) / box.height;   // 0 ~ 1
        inner.style.setProperty("--mx", x * 100 + "%");
        inner.style.setProperty("--my", y * 100 + "%");
        if (!reduceMotion) {
          btn.style.transform = `translate(${(x - 0.5) * STRENGTH}px, ${(y - 0.5) * STRENGTH}px)`;
        }
      });

      btn.addEventListener("pointerleave", () => {
        btn.style.transform = "";
      });

      btn.addEventListener("click", (event) => {
        if (reduceMotion) return;
        const box = inner.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "glow-ripple";
        ripple.setAttribute("aria-hidden", "true");
        ripple.style.left = event.clientX - box.left + "px";
        ripple.style.top = event.clientY - box.top + "px";
        inner.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      });
    });

    // ---------- 홀로그램 틸트 프로필 ----------
    const holo = document.querySelector(".holo");
    const stage = document.querySelector("main");   // 글 상자 어디서든 마우스를 따라 기울기
    const shine = holo.querySelector(".holo-shine");
    const pointer = { x: 0, y: 0, active: false };
    let flipped = false;

    // 스프링: 목표까지의 거리만큼 가속하고 감쇠로 속도를 줄여,
    // 살짝 지나쳤다가 돌아오는 '통통 튀는' 움직임을 만듭니다.
    function spring(s, target, stiffness, damping) {
      if (reduceMotion) { s.value = target; s.speed = 0; return; }
      s.speed = (s.speed + (target - s.value) * stiffness) * damping;
      s.value += s.speed;
    }
    const clamp = (v) => Math.max(-1, Math.min(1, v));

    stage.addEventListener("pointermove", (event) => {
      const box = holo.getBoundingClientRect();
      const reach = box.width * 2;   // 사진에서 이만큼 떨어지면 최대로 기울어짐
      pointer.x = clamp((event.clientX - (box.left + box.width / 2)) / reach);
      pointer.y = clamp((event.clientY - (box.top + box.height / 2)) / reach);
      pointer.active = true;
    });
    stage.addEventListener("pointerleave", () => { pointer.active = false; });

    holo.addEventListener("click", () => {
      flipped = !flipped;
      holo.setAttribute("aria-pressed", String(flipped));
      if (!flipped && !reduceMotion) {
        // 앞면으로 돌아오면 반짝임을 한 번 다시 재생
        setTimeout(() => {
          shine.classList.remove("is-on");
          void shine.offsetWidth;          // 애니메이션 처음부터 다시 시작하기 위한 요령
          shine.classList.add("is-on");
        }, 380);
      }
    });

    const tiltX = { value: 0, speed: 0 };
    const tiltY = { value: 0, speed: 0 };
    const flip  = { value: 0, speed: 0 };
    let last = performance.now();
    let elapsed = 0;

    function loop(now) {
      const delta = Math.min(48, now - last);
      last = now;
      elapsed += delta;
      const t = elapsed / 1000;
      // 마우스가 없으면 천천히 흔들리며 반짝이기 (움직임 줄이기 설정이면 가만히)
      const targetX = reduceMotion ? 0 : pointer.active ? pointer.x : Math.sin(t * 0.9) * 0.5;
      const targetY = reduceMotion ? 0 : pointer.active ? pointer.y : Math.cos(t * 0.65) * 0.3;
      for (let i = 0; i < Math.max(1, Math.round(delta / 16.7)); i++) {
        spring(tiltX, targetX, 0.08, 0.8);
        spring(tiltY, targetY, 0.08, 0.8);
        spring(flip, flipped ? 180 : 0, 0.05, 0.82);
      }
      const progress = Math.min(1, Math.max(0, flip.value / 180));
      holo.style.setProperty("--tx", tiltX.value.toFixed(4));
      holo.style.setProperty("--ty", tiltY.value.toFixed(4));
      holo.style.setProperty("--hyp", Math.min(1, Math.hypot(tiltX.value, tiltY.value)).toFixed(4));
      holo.style.setProperty("--flip", flip.value.toFixed(2) + "deg");
      holo.style.setProperty("--lift", Math.sin(progress * Math.PI).toFixed(4));
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ---------- 배경 음악 ----------
    const bgm = document.getElementById("bgm");
    const player = document.querySelector(".player");
    const progress = player.querySelector(".player-progress");
    const timeText = player.querySelector(".player-time");
    const playerButtons = {
      play:  player.querySelector('[data-act="play"]'),
      pause: player.querySelector('[data-act="pause"]'),
      stop:  player.querySelector('[data-act="stop"]'),
    };
    bgm.volume = 0.4;              // 너무 크지 않게 (0 ~ 1)
    let userTurnedOff = false;     // 방문자가 직접 끈 경우엔 다시 켜지 않기

    // 1:05 처럼 분:초 로 바꾸기
    const toTime = (s) => {
      if (!isFinite(s)) s = 0;
      return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    };

    // 지금 상태(재생 / 일시정지 / 정지)에 맞게 버튼 불 켜기
    function showMusicState() {
      const playing = !bgm.paused;
      const stopped = bgm.paused && bgm.currentTime === 0;
      playerButtons.play.setAttribute("aria-pressed", String(playing));
      playerButtons.pause.setAttribute("aria-pressed", String(!playing && !stopped));
      playerButtons.stop.setAttribute("aria-pressed", String(stopped));
      player.classList.toggle("is-playing", playing);
    }
    function showProgress() {
      const ratio = bgm.duration ? bgm.currentTime / bgm.duration : 0;
      progress.style.width = ratio * 100 + "%";
      timeText.textContent = toTime(bgm.currentTime) + " / " + toTime(bgm.duration);
    }
    bgm.addEventListener("play", showMusicState);
    bgm.addEventListener("pause", showMusicState);
    bgm.addEventListener("timeupdate", showProgress);
    bgm.addEventListener("loadedmetadata", showProgress);

    playerButtons.play.addEventListener("click", (event) => {
      event.stopPropagation();
      userTurnedOff = false;
      bgm.play().catch(() => {});
    });
    playerButtons.pause.addEventListener("click", (event) => {
      event.stopPropagation();
      userTurnedOff = true;
      bgm.pause();                 // 멈춘 자리 기억 → 재생 누르면 이어서
    });
    playerButtons.stop.addEventListener("click", (event) => {
      event.stopPropagation();
      userTurnedOff = true;
      bgm.pause();
      bgm.currentTime = 0;         // 처음으로 되감기 = 완전히 끄기
      showMusicState();
      showProgress();
    });

    // 브라우저는 소리가 나는 자동 재생을 막는 경우가 많아요.
    // 그래서 먼저 바로 틀어 보고, 막히면 방문자가 화면을 처음 누르거나 키를 누를 때 시작해요.
    function startOnFirstTouch() {
      if (!userTurnedOff && bgm.paused) bgm.play().catch(() => {});
    }
    bgm.play().catch(() => {
      document.addEventListener("pointerdown", startOnFirstTouch, { once: true });
      document.addEventListener("keydown", startOnFirstTouch, { once: true });
    });
  </script>
</body>
